
    <!DOCTYPE html>
    <html>
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <title>Ukrainians Wiki Articles</title>
            <script src="https://api.tiles.mapbox.com/mapbox-gl-js/v1.13.0/mapbox-gl.js"></script>
            <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap-theme.min.css" />
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css" />
        <script src='https://cdn.jsdelivr.net/npm/@deck.gl/jupyter-widget@~8.9.*/dist/index.js'></script>
        <style>
            body {
                font-family: Arial, sans-serif;
              margin: 0;
              padding: 0;
              overflow: hidden;
            }
            #deck-container {
              width: 100vw;
              height: 100vh;
              cursor: crosshair !important; /* Force crosshair cursor */
            }
            
            #deck-container canvas {
              z-index: 1;
              background: none;
              cursor: crosshair !important; /* Ensure crosshair for interactive elements */
            }
            #deck-container canvas {
              z-index: 1;
              background: none;
            }
            .button-container {
                position: absolute;
                top: 10px;
                left: 10px;
                z-index: 1000;
            }
            button {
                padding: 8px 15px;
                font-size: 14px;
                background-color: rgba(0, 123, 255, 0.8);
                color: white;
                border: none;
                cursor: pointer;
                margin: 5px;
                border-radius: 5px;
                transition: 0.3s;
            }
            iframe {
                width: 100vw;
                height: 100vh;
                border: none;
                cursor: crosshair;
            }
        </style>
        <script>
            function loadPage(page) {
                document.getElementById('content-frame').src = page;
            }
        </script>
    </head>
    <body>
        <div id="deck-container">
        <div class="button-container">
            <button onclick="loadPage('birth.html')">Народження</button>
            <button onclick="loadPage('death.html')">Смерть</button>
            <button onclick="loadPage('statistic.html')">Cтатистика</button>
        </div>
        <iframe id="content-frame" src="birth.html"></iframe>
    </body>
    </html>
